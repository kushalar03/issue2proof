name: Verify public demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "submission/demo/**"
      - ".github/workflows/verify-public-demo.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify production page
        env:
          PUBLIC_DEMO_URL: https://issue2proof-demo.vercel.app
        run: |
          set -euo pipefail
          curl --fail --show-error --location +            --retry 6 --retry-delay 10 --max-time 30 +            "$PUBLIC_DEMO_URL/" --output /tmp/issue2proof.html
          grep --fixed-strings --quiet "Issue2Proof" /tmp/issue2proof.html
          grep --fixed-strings --quiet "Public interactive demo" /tmp/issue2proof.html

      - name: Verify production security headers
        env:
          PUBLIC_DEMO_URL: https://issue2proof-demo.vercel.app
        run: |
          set -euo pipefail
          curl --fail --show-error --location --head +            "$PUBLIC_DEMO_URL/" --output /tmp/issue2proof.headers
          grep --ignore-case --quiet "^x-content-type-options: nosniff" /tmp/issue2proof.headers
          grep --ignore-case --quiet "^content-security-policy:" /tmp/issue2proof.headers
