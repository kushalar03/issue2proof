services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ISSUE2PROOF_ACCESS_TOKEN: ${ISSUE2PROOF_ACCESS_TOKEN:?Generate a strong application access token}
      ISSUE2PROOF_JUDGE_TOKEN: ${ISSUE2PROOF_JUDGE_TOKEN:-}
      ISSUE2PROOF_CAPSULE_SIGNING_KEY: ${ISSUE2PROOF_CAPSULE_SIGNING_KEY:-}
      ISSUE2PROOF_PUBLIC: "1"
      ISSUE2PROOF_DAILY_BUDGET_USD: ${ISSUE2PROOF_DAILY_BUDGET_USD:-25}
      ISSUE2PROOF_TOTAL_BUDGET_USD: ${ISSUE2PROOF_TOTAL_BUDGET_USD:-25}
      ISSUE2PROOF_PROTECTED_RESERVE_USD: ${ISSUE2PROOF_PROTECTED_RESERVE_USD:-0}
      ISSUE2PROOF_RETENTION_DAYS: ${ISSUE2PROOF_RETENTION_DAYS:-7}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_PROJECT_ID: ${NEBIUS_PROJECT_ID:-}
      NEBIUS_SANDBOX_IMAGE: ${NEBIUS_SANDBOX_IMAGE:-python:3.12-slim}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      ISSUE2PROOF_MODEL_FAST: ${ISSUE2PROOF_MODEL_FAST:-nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B}
      ISSUE2PROOF_MODEL_ENGINEERING: ${ISSUE2PROOF_MODEL_ENGINEERING:-nvidia/nemotron-3-super-120b-a12b}
      ISSUE2PROOF_MODEL_REASONING: ${ISSUE2PROOF_MODEL_REASONING:-nvidia/Nemotron-3-Ultra-550b-a55b}
      ISSUE2PROOF_EMBEDDING_MODEL: ${ISSUE2PROOF_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
    volumes:
      - evidence:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8000"
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set your domain with DNS pointing at this server}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  evidence:
  caddy-data:
  caddy-config:
