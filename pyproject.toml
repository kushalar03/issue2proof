[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "issue2proof"
version = "2.0.0"
description = "Executable repository memory for AI-built software"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pytest>=9.0.3,<10", "packaging>=24,<27"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]
sandbox = ["contree-sdk==0.3.6", "contree-client[httpx]==0.4.1"]

[tool.setuptools.packages.find]
include = ["issue2proof*"]

[tool.setuptools.package-data]
issue2proof = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF012"]
