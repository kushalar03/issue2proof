<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Issue2Proof demo capture shell</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;grid-template-rows:986px 94px}iframe{width:100%;height:100%;border:0;background:#fbfaf5}.stage{position:relative;overflow:hidden}.chapter{position:absolute;z-index:4;right:54px;top:95px;padding:13px 18px;border-radius:14px 14px 14px 4px;background:#18382d;color:white;box-shadow:0 14px 35px rgba(18,45,34,.22);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.cursor{position:absolute;z-index:5;left:960px;top:440px;width:28px;height:28px;border:4px solid #ef835f;border-radius:50%;box-shadow:0 0 0 9px rgba(239,131,95,.21);transition:1s cubic-bezier(.2,.8,.2,1);pointer-events:none}.cursor:after{content:"";position:absolute;inset:8px;border-radius:50%;background:white}.caption{display:flex;align-items:center;gap:24px;padding:0 72px;background:#0c211a;color:white}.caption b{flex:0 0 auto;padding-right:24px;border-right:1px solid #3d5148;color:#90ab9c;font-size:12px;letter-spacing:.15em;text-transform:uppercase}.caption p{margin:0;font-size:19px;line-height:1.35}.caption time{margin-left:auto;color:#7f9b8d;font:12px/1 ui-monospace,monospace}
  </style>
</head>
<body>
  <div class="stage"><iframe id="product" title="Issue2Proof product"></iframe><div class="chapter" id="chapter">Overview</div><div class="cursor"></div></div>
  <footer class="caption"><b id="label">Issue2Proof</b><p id="caption">Regression memory for AI coding agents that survives the agent.</p><time id="clock">00:00</time></footer>
  <script>
    const query=new URLSearchParams(location.search), frame=document.querySelector('#product'), cursor=document.querySelector('.cursor'), started=performance.now();
    frame.src=query.get('page')||'demo/index.html';document.querySelector('#chapter').textContent=query.get('chapter')||'Overview';
    window.videoDemo={caption(value){document.querySelector('#caption').innerHTML=value},label(value){document.querySelector('#label').textContent=value},move(x,y){cursor.style.left=x+'px';cursor.style.top=y+'px'},page(value){frame.src=value},frame};
    function tick(){const t=Math.floor((performance.now()-started)/1000);document.querySelector('#clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');requestAnimationFrame(tick)}tick();
  </script>
</body>
</html>
